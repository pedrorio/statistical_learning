schema: spec-driven

context: |
  Course report on master. The graded artifact is the committed main.pdf.
  Do not change modelling, the split, the metric, or that PDF unless a proposal says the numbers may change.
  results/ is generated at runtime and gitignored. The graded main.pdf stays committed. There is no Makefile and no CI.

rules:
  proposal:
    - State whether modelling results are allowed to change. Default is they are not.
